<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1200" viewBox="0 0 1200 1200">
  <rect width="1200" height="1200" fill="#F7F3EA"/>
  <rect x="78" y="72" width="1044" height="1056" rx="40" fill="#FFFFFF"/>
  <rect x="126" y="120" width="280" height="56" rx="28" fill="#DDF1EA"/>
  <text x="266" y="158" text-anchor="middle" fill="#25665E" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, sans-serif" font-size="27" font-weight="700">MODEL NOTES</text>
  <text x="126" y="290" fill="#173F4A" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, sans-serif" font-size="68" font-weight="700">写作、代码、长文</text>
  <text x="126" y="382" fill="#173F4A" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, sans-serif" font-size="68" font-weight="700">模型到底怎么挑？</text>
  <text x="126" y="456" fill="#6D858B" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, sans-serif" font-size="36">不用先背参数，先看自己要做什么</text>
  <rect x="126" y="536" width="948" height="160" rx="30" fill="#E6F4F0"/>
  <circle cx="204" cy="616" r="42" fill="#23768A"/>
  <path d="M187 616h34M204 599v34" stroke="#FFFFFF" stroke-width="8" stroke-linecap="round"/>
  <text x="280" y="603" fill="#174654" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, sans-serif" font-size="38" font-weight="700">先问自己：现在卡在哪？</text>
  <text x="280" y="654" fill="#638087" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, sans-serif" font-size="30">快速起草，还是慢慢梳理？</text>
  <rect x="126" y="734" width="448" height="262" rx="30" fill="#E8F4F4"/>
  <text x="168" y="812" fill="#1B6172" font-family="Arial, sans-serif" font-size="46" font-weight="700">GPT</text>
  <text x="168" y="872" fill="#315B67" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, sans-serif" font-size="32" font-weight="700">起草、问答、代码</text>
  <text x="168" y="923" fill="#71898F" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, sans-serif" font-size="27">有明确问题时先试试</text>
  <rect x="626" y="734" width="448" height="262" rx="30" fill="#F0ECFC"/>
  <text x="668" y="812" fill="#5C42B7" font-family="Arial, sans-serif" font-size="46" font-weight="700">Claude</text>
  <text x="668" y="872" fill="#43346F" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, sans-serif" font-size="32" font-weight="700">长文、整理、分析</text>
  <text x="668" y="923" fill="#8276A9" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, sans-serif" font-size="27">材料很多时可以试试</text>
  <text x="600" y="1065" text-anchor="middle" fill="#214F5C" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, sans-serif" font-size="40" font-weight="700">选模型，不是站队，是解决眼前的问题</text>
